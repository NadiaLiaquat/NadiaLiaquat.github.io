    <script>
      // Companion to public/404.html — restores the real URL that GitHub
      // Pages' redirect encoded, before React Router mounts. Harmless no-op
      // on any host that never hits that redirect (Cloudflare Pages, Vercel,
      // Netlify all rewrite server-side and never touch this).
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
