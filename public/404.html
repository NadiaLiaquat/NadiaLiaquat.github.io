<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // Single Page Apps for GitHub Pages — https://github.com/rafgraph/spa-github-pages
      //
      // GitHub Pages has no server-side rewrite support, so a direct link or
      // refresh on a client-routed path (e.g. /blog/some-post) would 404
      // without this. It encodes the real path into a query string and
      // redirects to index.html, where a matching script (see index.html)
      // decodes it back before React Router mounts. Not used by hosts with
      // proper SPA rewrites (Cloudflare Pages, Vercel, Netlify) — this file
      // is simply ignored there.
      //
      // Set to 1 if this is a GitHub Pages PROJECT page
      // (https://user.github.io/repo-name/). Leave at 0 for a USER/ORG page
      // (https://user.github.io/) — the setup this repo's deploy workflow
      // targets by default.
      var pathSegmentsToKeep = 0

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
